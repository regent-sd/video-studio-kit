<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mossy · plant care</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%232f7d55'/%3E%3C/svg%3E" />
</head>
<body>
  <!-- Mossy is a made-up app with made-up data. It exists so the walkthrough rig has
       something to record before you point it at your own product. Nothing is saved:
       every reload starts from the same plants, so every take starts the same way. -->
  <header class="top">
    <a class="brand" href="#/plants" aria-label="Mossy home">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="#2f7d55"/><path d="M16 25c0-7 2-11 8-14-1 6-4 10-8 14zm0 0c0-5-2-8-7-10 1 5 3 8 7 10z" fill="#e9f5ee"/></svg>
      <span>Mossy</span>
    </a>
    <nav aria-label="Main">
      <a href="#/plants" data-nav="plants">Plants</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
  </header>

  <main id="main"></main>

  <div id="toast" role="status" aria-live="polite"></div>

  <dialog id="add-dialog" aria-labelledby="add-title">
    <form method="dialog" id="add-form">
      <h2 id="add-title">Add a plant</h2>
      <label>Name
        <input name="plant" placeholder="e.g. Peace lily" autocomplete="off" required />
      </label>
      <label>Room
        <select name="room">
          <option>Living room</option>
          <option>Kitchen</option>
          <option>Bedroom</option>
          <option>Office</option>
          <option>Bathroom</option>
        </select>
      </label>
      <label>Water every
        <span class="days"><input name="every" type="number" min="1" max="60" value="7" /> days</span>
      </label>
      <div class="actions">
        <button type="button" class="ghost" id="add-cancel">Cancel</button>
        <button type="submit" class="primary" id="add-save">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
