<style>
/* Layout: sticky search bar; filter column on the left (a drawer on phones); virtualized grid or a plain list on the right. */
:root {
  --bg: #F4F4F1; --panel: #FFFFFF; --panel-2: #ECECE7; --line: #DDDDD6; --line-strong: #C4C4BB;
  --text: #1C1C1A; --muted: #62625B; --accent: #2E5E8C; --accent-ink: #FFFFFF; --accent-weak: rgba(46, 94, 140, .10);

  --warn-bg: #F6E7C8; --warn: #6B4A0B; --info-bg: #E3E8EF; --info: #2D3C52; --focus: #2E5E8C;
  --ph: #E9E9E4; --ph-ink: #6E6E66; --shade: rgba(10, 10, 10, .45); --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 6px 18px rgba(0, 0, 0, .05);

  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141413; --panel: #1C1C1A; --panel-2: #252522; --line: #33332F; --line-strong: #4A4A44;
  --text: #F1F1EC; --muted: #A9A9A0; --accent: #8DB6E0; --accent-ink: #0E1620; --accent-weak: rgba(141, 182, 224, .14);
  --chip: #2A2A27; --chip-ink: #E4E4DD; --chip-on: #E4E4DD; --chip-on-ink: #1C1C1A;
  --warn-bg: #3A2F17; --warn: #E8C77E; --info-bg: #232A34; --info: #D2DCE8; --focus: #8DB6E0;
  --ph: #22221F; --ph-ink: #9C9C93; --shade: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141413; --panel: #1C1C1A; --panel-2: #252522; --line: #33332F; --line-strong: #4A4A44;
  --text: #F1F1EC; --muted: #A9A9A0; --accent: #8DB6E0; --accent-ink: #0E1620; --accent-weak: rgba(141, 182, 224, .14);
  --chip: #2A2A27; --chip-ink: #E4E4DD; --chip-on: #E4E4DD; --chip-on-ink: #1C1C1A;

  --ph: #22221F; --ph-ink: #9C9C93; --shade: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body { margin: 0; font: 14px/1.45 var(--sans); }
img { max-width: 100%; }
[hidden] { display: none !important; }

:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px; }

.search { flex: 1 1 280px; min-width: 0; position: relative; }
.search input { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--bg); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; fill: none; stroke: var(--muted); stroke-width: 2; }
.search input:not(:placeholder-shown) + kbd { display: none; }
.search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }

.btn { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--text); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.home { color: var(--muted); text-decoration: none; font-size: 13px; }

aside#filters { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: start; max-height: calc(100vh - 90px); overflow-y: auto; padding-right: 4px; }

.selbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--info-bg); color: var(--info); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; }

#grid { position: relative; }
.card { position: absolute; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; }
.card:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
.card.selected { outline: 2px solid var(--accent); outline-offset: -1px; }

.card .th img { width: 100%; height: 100%; object-fit: contain; display: block; }
.card .cap { padding: 7px 9px 8px; min-width: 0; }
.card .nm { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .mt { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.card .pick { position: absolute; top: 6px; left: 6px; width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--accent); display: grid; place-items: center; font-size: 15px; line-height: 1; cursor: pointer; opacity: 0; }
.card:hover .pick, .card:focus-within .pick, .card.selected .pick, .touch .card .pick { opacity: 1; }

.card .badge { position: absolute; top: 6px; right: 6px; font-size: 11px; background: var(--shade); color: #FFFFFF; border-radius: 4px; padding: 1px 6px; }
.ph { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: var(--ph); color: var(--ph-ink); }
.ph .ext { font: 700 22px/1 var(--mono); letter-spacing: .04em; }
.ph .ext.long { font-size: 15px; }
.ph .kd { font-size: 12px; }
.sprite { background-repeat: no-repeat; flex: none; }

.listwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--panel-2); position: sticky; top: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--accent-weak); }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.fold { color: var(--muted); max-width: 360px; overflow-wrap: anywhere; }
td.nm { font-weight: 600; overflow-wrap: anywhere; min-width: 160px; }
td.tg { color: var(--muted); max-width: 280px; }
.empty { padding: 48px 16px; text-align: center; color: var(--muted); }

#detail { position: fixed; inset: 0; z-index: 40; background: var(--shade); display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dlg { background: var(--panel); color: var(--text); border-radius: 12px; width: min(1100px, 100%); max-height: 100%; overflow: auto; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
.dlg .pv { background: var(--panel-2); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 8px; min-height: 320px; }

.dlg .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.dlg .head { display: flex; gap: 8px; align-items: flex-start; }
.dlg .head h2 { flex: 1; }
.dlg .nav { display: flex; gap: 4px; }
.warns { display: flex; flex-direction: column; gap: 4px; }
.warn { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 5px 9px; font-size: 13px; }
dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.copies { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.copy { border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.copy code { font: 12px var(--mono); overflow-wrap: anywhere; }
.copy .tagline { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font-size: 11px; border-radius: 999px; padding: 1px 8px; background: var(--chip); color: var(--chip-ink); }
.pill.lock { background: var(--info-bg); color: var(--info); }
.pill.del { background: var(--warn-bg); color: var(--warn); }
h4 { margin: 4px 0 0; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--chip-on); color: var(--chip-on-ink); padding: 8px 14px; border-radius: 8px; z-index: 60; box-shadow: var(--shadow); }
#copybox { position: fixed; inset: 0; z-index: 70; background: var(--shade); display: flex; align-items: center; justify-content: center; padding: 16px; }
#copybox .dlg { display: block; padding: 16px; width: min(640px, 100%); }
#copybox textarea { width: 100%; height: 200px; font: 12px var(--mono); background: var(--bg); color: var(--text); border: 1px solid var(--line-strong); border-radius: 6px; }
.scrim { display: none; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .only-phone { display: inline-flex; }
  aside#filters { position: fixed; z-index: 35; top: 0; bottom: auto; left: 0; width: min(330px, 88vw); height: 100vh; height: 100dvh; max-height: none; background: var(--panel); padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 24px max(16px, env(safe-area-inset-left, 0px)); transform: translateX(-105%); transition: transform .2s; box-shadow: var(--shadow); }
  body.filters-open aside#filters { transform: none; }
  #closeFilters { position: sticky; bottom: 0; width: 100%; justify-content: center; margin-top: 8px; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  body.filters-open .scrim { display: block; position: fixed; inset: 0; z-index: 34; background: var(--shade); }
  .dlg { grid-template-columns: minmax(0, 1fr); }
  .dlg .pv { min-height: 200px; }
  .search kbd { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top"><div class="wrap">
  <a class="brand" id="brand" href="#"><b>Asset Library</b><small id="brandName"></small></a>
  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>

    <kbd>/</kbd>

  <button class="btn only-phone" id="openFilters" type="button" aria-controls="filters">Filters</button>

</div></header>

<div class="wrap"><div class="layout">

</div></div>

// ---------- data
function prep(d) {
  DATA = d;
  const multi = (d.r || []).length > 1;
  FOLD = d.f.map(([p, link]) => {
    const parts = p ? p.split('/') : [];
    const top = multi ? parts.slice(0, 2).join('/') : (parts[1] || '(top level)');
    return { p, link, root: parts[0] || '', top, del: parts.slice(1).includes('_To Delete') };
  });
  CONTENT = d.a.map((c, i) => {
    const tg = c.tg || {};
    const mod = c.c.map((x) => x[3]).filter(Boolean).sort()[0] || '';
    const date = c.tk || mod;
    let orient = null;
    if (c.w && c.h) { const r = c.w / c.h; orient = r > 1.05 ? 'landscape' : r < 0.95 ? 'portrait' : 'square'; }
    const yr = tg.year ? String(tg.year) : (c.tk ? c.tk.slice(0, 4) : null);
    const fl = c.fl || [];
    const tagWords = [];
    for (const k in tg) { const v = tg[k]; (Array.isArray(v) ? v : [v]).forEach((x) => tagWords.push(String(x), words(x))); }
    return { i, c, tg, date, orient, yr, fl,
      prev: !!(c.t || c.s),
      people: fl.includes('people-visible') || fl.includes('customers-visible') || fl.includes('kids-visible'),
      retired: c.bs === 'retired' || fl.includes('old-logo'),
      ready: tg.use === 'ready-to-post',
      text: [c.ds || '', tagWords.join(' '), fl.join(' '), fl.map((f) => FLAG[f] || '').join(' '), c.bs || '', KIND[c.k] || '', c.x].join(' ').toLowerCase() };
  });
}

function buildItems() {
  ITEMS = [];
  for (const C of CONTENT) {
    const cps = S.all ? C.c.c : C.c.c.filter((x) => !FOLD[x[0]].del);
    if (!cps.length) continue;
    const groups = S.all ? cps.map((x) => [x]) : [cps];
    for (const g of groups) {
      const tops = [...new Set(g.map((x) => FOLD[x[0]].top))];
      const hay = (g.map((x) => FOLD[x[0]].p + '/' + x[1]).join(' ') + ' ' + C.text).toLowerCase();
      const tg = C.tg;
      const fv = {
        kind: [C.c.k], top: tops, type: tg.type ? [tg.type] : [], subject: Array.isArray(tg.subject) ? tg.subject.map(String) : [],
        setting: tg.setting ? [tg.setting] : [], location: tg.location ? [tg.location] : [], campaign: tg.campaign ? [String(tg.campaign)] : [],
        year: C.yr ? [C.yr] : [], use: tg.use ? [tg.use] : [], rating: tg.rating ? [String(tg.rating)] : [], brand: C.c.bs ? [C.c.bs] : [],
        orient: C.orient ? [C.orient] : [],

}

// ---------- filtering
function run() {
  const qs = S.q.toLowerCase().split(/\s+/).filter(Boolean);
  const active = FKEYS.filter((k) => S.f[k] && S.f[k].size);
  counts = {}; FKEYS.forEach((k) => (counts[k] = new Map()));
  const allVals = {}; FKEYS.forEach((k) => (allVals[k] = new Map()));
  VIEW = [];
  for (const it of ITEMS) {
    for (const k of FKEYS) for (const v of it.fv[k]) allVals[k].set(v, (allVals[k].get(v) || 0) + 1);
    const C = it.C;
    if (S.t.people && C.people) continue;
    if (S.t.retired && C.retired) continue;
    if (S.t.ready && !C.ready) continue;
    if (S.t.preview && !C.prev) continue;
    let ok = true;
    for (const w of qs) if (!it.hay.includes(w)) { ok = false; break; }
    if (!ok) continue;
    let fails = 0, failK = null;
    for (const k of active) {
      const set = S.f[k];
      if (!it.fv[k].some((v) => set.has(v))) { fails++; failK = k; if (fails > 1) break; }
    }
    if (fails > 1) continue;
    for (const k of FKEYS) {
      if (fails === 1 && k !== failK) continue;
      for (const v of it.fv[k]) counts[k].set(v, (counts[k].get(v) || 0) + 1);
    }
    if (fails === 0) VIEW.push(it);
  }
  const by = {
    new: (a, b) => (b.C.date || '').localeCompare(a.C.date || '') || a.name.localeCompare(b.name),
    old: (a, b) => (a.C.date || '9').localeCompare(b.C.date || '9') || a.name.localeCompare(b.name),
    name: (a, b) => a.name.localeCompare(b.name),
    size: (a, b) => b.C.c.b - a.C.c.b,
    rating: (a, b) => (b.C.tg.rating || 0) - (a.C.tg.rating || 0) || (b.C.date || '').localeCompare(a.C.date || ''),
  };
  VIEW.sort(by[S.sort] || by.new);
  renderFacets(allVals);
  renderActive();
  const total = ITEMS.length;
  $('count').textContent = `${nf.format(VIEW.length)} of ${nf.format(total)} ${S.all ? 'copies' : 'files'}`;
  $('empty').hidden = VIEW.length > 0;
  $('clearAll').hidden = !(S.q || active.length || Object.values(S.t).some(Boolean) || S.all);
  listShown = 300;
  renderView(true);
  writeHash();
}

function renderFacets(allVals) {
  let html = '';
  for (const [k, title, label] of FACETS) {
    const all = allVals[k];
    if (!all.size) continue;
    const sel = S.f[k] || new Set();
    let vals = [...all.keys()];
    if (k === 'year') vals.sort((a, b) => b.localeCompare(a));
    else if (k === 'rating') vals.sort((a, b) => b - a);
    else vals.sort((a, b) => (counts[k].get(b) || 0) - (counts[k].get(a) || 0) || (all.get(b) - all.get(a)) || String(a).localeCompare(String(b)));
    const lim = LONG[k] && !expanded[k] ? 8 : Infinity;
    const shown = vals.filter((v, i) => i < lim || sel.has(v));
    html += `<div class="fgroup"><h3>${esc(title)}${sel.size ? `<button type="button" data-clear="${k}">Clear</button>` : ''}</h3><div class="chips">`;
    for (const v of shown) {
      const n = counts[k].get(v) || 0;
      html += `<button type="button" class="chip${n || sel.has(v) ? '' : ' zero'}" data-f="${k}" data-v="${esc(v)}" aria-pressed="${sel.has(v)}" title="${esc(label(v))}"><span class="t">${esc(label(v))}</span><span class="n">${nf.format(n)}</span></button>`;
    }
    html += '</div>';
    if (vals.length > shown.length || expanded[k]) html += `<button type="button" class="more" data-more="${k}">${expanded[k] ? 'Show fewer' : `Show all ${vals.length}`}</button>`;
    html += '</div>';

  $('facets').innerHTML = html;
}

function renderActive() {
  let h = '';
  if (S.q) h += `<button type="button" class="chip" data-unq="1">“${esc(S.q)}” ✕</button>`;
  for (const [k, title, label] of FACETS) for (const v of (S.f[k] || [])) h += `<button type="button" class="chip" data-f="${k}" data-v="${esc(v)}" aria-pressed="true">${esc(title)}: ${esc(label(v))} ✕</button>`;

// ---------- previews

// ---------- detail

// ---------- events

    case 'vGrid': S.view = 'grid'; store('view', 'grid'); renderView(); writeHash(); break;
    case 'vList': S.view = 'list'; store('view', 'list'); renderView(); writeHash(); break;
    case 'listMore': listShown += 300; renderList(); break;
    case 'clearAll': S.q = ''; $('q').value = ''; S.f = {}; S.t = {}; S.all = false; syncControls(); buildItems(); run(); break;
    case 'selCopy': copy(selectedLines(), `Copied ${selected.size} ${selected.size === 1 ? 'line' : 'lines'}`); break;
    case 'selClear': selected.clear(); renderSel(); lastRange = ''; renderGrid(true); break;
    case 'openFilters': document.body.classList.add('filters-open'); break;
    case 'closeFilters': document.body.classList.remove('filters-open'); break;
    case 'copyClose': $('copybox').hidden = true; break;
    case 'csv':
      if (CFG.mode === 'local') {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob(['﻿' + csvText()], { type: 'text/csv' }));
        a.download = 'asset-library.csv'; document.body.appendChild(a); a.click(); a.remove();
      } else copy(csvText(), `Copied ${nf.format(VIEW.length)} rows; paste into Google Sheets`);
      break;
    case 'brand': e.preventDefault(); $('clearAll').click(); break;
  }
});
document.addEventListener('keydown', (e) => {
  if (!$('detail').hidden) {
    if (e.key === 'Escape') closeDetail();
    else if (e.key === 'ArrowLeft') openDetail(cur - 1);
    else if (e.key === 'ArrowRight') openDetail(cur + 1);
    return;
  }
  if (e.key === 'Escape' && !$('copybox').hidden) { $('copybox').hidden = true; return; }
  if (e.key === 'Escape') document.body.classList.remove('filters-open');
  if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); return; }
  const row = e.target.closest && e.target.closest('[data-i]');
  if (row && (e.key === 'Enter' || e.key === ' ') && e.target === row) { e.preventDefault(); openDetail(+row.dataset.i); }
});
for (const [k, id] of Object.entries(TOGGLES)) $(id).addEventListener('change', () => { S.t[k] = $(id).checked; run(); });
$('tAll').addEventListener('change', () => { S.all = $('tAll').checked; buildItems(); run(); });
$('sort').addEventListener('change', () => { S.sort = $('sort').value; store('sort', S.sort); run(); });
let scT = 0;
window.addEventListener('scroll', () => { if (S.view === 'grid' && !scT) scT = requestAnimationFrame(() => { scT = 0; renderGrid(); }); }, { passive: true });
window.addEventListener('resize', () => { if (S.view === 'grid') { layoutGrid(); lastRange = ''; renderGrid(true); } });
window.addEventListener('hashchange', () => { if ((location.hash || '').slice(1) === lastHash) return; readHash(); syncControls(); buildItems(); run(); });
if ('ontouchstart' in window) document.documentElement.classList.add('touch');

function syncControls() {
  $('q').value = S.q;
  for (const [k, id] of Object.entries(TOGGLES)) $(id).checked = !!S.t[k];
  $('tAll').checked = S.all; $('sort').value = S.sort;
}

// ---------- start
if (CFG.mode === 'local') { const h = $('home'); h.href = CFG.home || '/studio'; h.hidden = false; }
else $('csv').textContent = 'Copy as CSV';
readHash(); syncControls();
fetch(CFG.data).then((r) => { if (!r.ok) throw new Error(`${r.status} ${r.statusText}`); return r.json(); }).then((d) => {
  if (d.b) $('brandName').textContent = d.b;
  if (d.empty) { $('count').textContent = 'No catalog yet'; $('empty').hidden = false; $('empty').textContent = d.empty; $('dataNote').textContent = d.empty; return; }
  prep(d);
  const tagged = CONTENT.filter((C) => C.c.ds).length, prev = CONTENT.filter((C) => C.prev).length;
  $('dataNote').textContent = `${nf.format(CONTENT.length)} unique files; ${nf.format(prev)} with a preview, ${nf.format(tagged)} described so far.`
    + (tagged ? '' : ' Search covers names and folders until descriptions and tags are added.') + (d.g ? ` Catalog of ${d.g.slice(0, 10)}.` : '')
    + ' Read the warnings on a file before you post it anywhere.';
  buildItems(); run();
}).catch((err) => { $('count').textContent = 'The catalog didn’t load.'; $('empty').hidden = false; $('empty').textContent = `Couldn’t load the asset list (${err.message}). Reload the page to try again.`; });
})();
</script>
